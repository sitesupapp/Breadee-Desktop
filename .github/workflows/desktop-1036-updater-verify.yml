name: desktop-1036-updater-verify

# READ-ONLY updater verification on a clean runner. Writes a single report.md and
# GATES on the cryptographic signature verdict (fails the run if the prod-signed
# 1.0.36 artifact does not verify against the embedded production pubkey).
# Publishes nothing; advances no channel.
on:
  push:
    branches: [ "ci/desktop-1036-updater-verify" ]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: "38817031890"
      EXPECT_SHA256: "56c7b8187fa818132a0cd5b19538359271016686aaf63d65106d74df247160ab"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-1.0.36-ui
          fetch-depth: 0
      - name: Verify
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y minisign >/dev/null
          R=report.md; : > "$R"
          echo "# Desktop 1.0.36 updater verification ($(date -u))" >> "$R"

          echo -e "\n## 1) PROD updater config" >> "$R"
          node -e "const c=require('./src-tauri/tauri.conf.json');console.log(JSON.stringify((c.plugins&&c.plugins.updater)||c.updater||{},null,2))" > prod_updater.json
          cat prod_updater.json >> "$R"
          node -e "const c=require('./src-tauri/tauri.conf.json');const u=(c.plugins&&c.plugins.updater)||c.updater||{};process.stdout.write(u.pubkey||'')" > prod_pubkey.b64

          echo -e "\n## 2) Updater implementation + runtime override scan" >> "$R"
          echo '### files referencing updater/endpoint/override:' >> "$R"
          grep -rniE "endpoint|checkUpdate|check_update|Updater|setEndpoint|UPDATER_ENDPOINT|override|__TAURI" src app 2>/dev/null | grep -iE "updat|endpoint|override" | head -80 >> "$R" || true
          echo -e "\n### src/lib/updater.ts (full, if present):" >> "$R"
          (cat src/lib/updater.ts 2>/dev/null || echo "(no src/lib/updater.ts)") >> "$R"

          echo -e "\n## 3) STAGING 1.0.35 (tag) config + variants" >> "$R"
          echo "src-tauri conf variants on 1.0.36 branch:" >> "$R"
          ls src-tauri/*.conf.json >> "$R" 2>/dev/null || true
          echo "tag desktop-staging-v1.0.35 : tauri.conf.json updater + build config:" >> "$R"
          git show "refs/tags/desktop-staging-v1.0.35:src-tauri/tauri.conf.json" 2>/dev/null > staging_conf_full.json || echo "(tag read failed)" >> "$R"
          if [ -s staging_conf_full.json ]; then
            node -e "const c=require('./staging_conf_full.json');console.log('updater:',JSON.stringify((c.plugins&&c.plugins.updater)||c.updater||{},null,2))" >> "$R" 2>&1 || true
            node -e "const c=require('./staging_conf_full.json');const u=(c.plugins&&c.plugins.updater)||c.updater||{};process.stdout.write(u.pubkey||'')" > staging_pubkey.b64 || true
          fi
          echo "staging-updater branches/configs present:" >> "$R"
          git ls-files --error-unmatch src-tauri/tauri.staging.conf.json 2>/dev/null && echo "has tauri.staging.conf.json" >> "$R" || echo "no tauri.staging.conf.json on 1.0.36 branch" >> "$R"

          echo -e "\n## 4) Live channel manifests" >> "$R"
          for br in desktop-production-channel desktop-staging-channel; do
            echo "### $br:latest.json" >> "$R"
            (git show "origin/$br:latest.json" 2>/dev/null || echo "(none)") >> "$R"
          done

          echo -e "\n## 5) Artifact download + SHA256 integrity" >> "$R"
          gh run download "$RUN_ID" -R sitesupapp/Breadee-Desktop -n breadee-desktop-1.0.36-signed-unpublished -D art
          ls -la art >> "$R"
          GOT=$(sha256sum "art/Breadee_1.0.36_x64-setup.exe" | awk '{print $1}')
          echo "sha256=$GOT expected=$EXPECT_SHA256" >> "$R"
          [ "$GOT" = "$EXPECT_SHA256" ] && echo "SHA256: MATCH" >> "$R" || { echo "SHA256: MISMATCH" >> "$R"; cp "$R" report_final.md; exit 1; }

          echo -e "\n## 6) CRYPTOGRAPHIC signature verification (minisign-verify crate = EXACT tauri updater verifier, GATING)" >> "$R"
          base64 -d prod_pubkey.b64 > prod_pub.key
          cat prod_pub.key >> "$R"
          PK=$(grep -vE '^untrusted comment' prod_pub.key | head -1)
          echo "prod pubkey line: $PK" >> "$R"
          echo "--- raw .sig file (base64-wrapped by tauri) ---" >> "$R"
          wc -c "art/Breadee_1.0.36_x64-setup.exe.sig" >> "$R"
          # Tauri's .sig artifact is the BASE64 of the minisign signature file; decode it to plaintext minisign.
          base64 -d "art/Breadee_1.0.36_x64-setup.exe.sig" > sig_plain.txt
          echo "decoded plaintext minisign signature:" >> "$R"
          cat sig_plain.txt >> "$R"
          echo "--- installing rsign2 (robust minisign verifier) ---" >> "$R"
          cargo install rsign2 --quiet 2>>"$R" || cargo install rsign2 2>>"$R" || true
          export PATH="$HOME/.cargo/bin:$PATH"
          if rsign verify -p prod_pub.key -x sig_plain.txt "art/Breadee_1.0.36_x64-setup.exe" >> "$R" 2>&1; then
            echo "PROD-PUBKEY SIGNATURE: VERIFIED (rsign2, decoded sig)" >> "$R"; PROD_OK=1
          else
            echo "PROD-PUBKEY SIGNATURE: rsign2 path failed; trying minisign-verify crate fallback" >> "$R"
            mkdir -p verifier/src
            printf '%s\n' '[package]' 'name = "v"' 'version = "0.0.0"' 'edition = "2021"' '[dependencies]' 'minisign-verify = "0.2"' > verifier/Cargo.toml
            printf '%s\n' 'use minisign_verify::{PublicKey, Signature};' 'use std::fs;' 'fn main(){' '  let a:Vec<String>=std::env::args().collect();' '  let pkfile=fs::read_to_string(&a[1]).unwrap();' '  let pk=PublicKey::decode(&pkfile).or_else(|_|PublicKey::from_base64(pkfile.lines().last().unwrap().trim())).expect("pk");' '  let sig=Signature::decode(&fs::read_to_string(&a[2]).unwrap()).expect("sigdecode");' '  let d=fs::read(&a[3]).unwrap();' '  pk.verify(&d,&sig,false).expect("VERIFY FAILED");' '  println!("CRATE VERIFIED");' '}' > verifier/src/main.rs
            if (cd verifier && cargo run --quiet --release -- ../prod_pub.key ../sig_plain.txt ../art/Breadee_1.0.36_x64-setup.exe) >> "$R" 2>&1; then
              echo "PROD-PUBKEY SIGNATURE: VERIFIED (minisign-verify crate)" >> "$R"; PROD_OK=1
            else
              echo "PROD-PUBKEY SIGNATURE: FAILED (both verifiers)" >> "$R"; PROD_OK=0
            fi
          fi
          if [ -s staging_pubkey.b64 ]; then
            base64 -d staging_pubkey.b64 > staging_pub.key
            SPK=$(grep -vE '^untrusted comment' staging_pub.key | head -1)
            echo "staging pubkey line: $SPK" >> "$R"
            [ "$PK" = "$SPK" ] && echo "PUBKEY PARITY prod==staging: YES" >> "$R" || echo "PUBKEY PARITY prod==staging: NO" >> "$R"
          else
            echo "staging pubkey: not captured" >> "$R"
          fi
          cp "$R" report_final.md
          [ "$PROD_OK" = "1" ] || { echo "::error::prod-pubkey signature verification FAILED"; exit 1; }
          echo "ALL CHECKS PASSED"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-verify-report
          path: |
            report_final.md
            report.md
            prod_updater.json
            staging_conf_full.json
          if-no-files-found: ignore
