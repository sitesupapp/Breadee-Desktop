# CI-only (ci/desktop-1045-revalidate-verify, never merged): Desktop Windows build check for the
# Staging 1.0.45 candidate = cumulative 1.0.44 + U-1 revalidation retry. Typecheck, focused regression
# tests, the full suite (compared by name against the baseline), vite build, cargo check / test.
# No installer, no release, no publish.

name: Desktop Windows Build Check

on:
  push:
    branches: [desktop-staging, ci/desktop-1045-revalidate-verify]
  pull_request:
    branches: [main, desktop-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Windows build check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Focused regression tests (U-1 retry, L4/1, R3-M1, DESK, offline, financial, isolation, sync)
        run: node --test --test-concurrency=1 --import ./test/register.mjs test/session-revalidation-retry.test.ts test/session-permission-refresh.test.ts test/l41-refused-open-session.test.ts test/desktop-1043-split-map-refresh.test.ts test/desktop-1042-offline-acceptance.test.ts test/desktop-1041-online-acceptance.test.ts test/rc-auth-1-local-signout.test.ts test/pos-session-snapshot.test.ts test/offline-shift-store.test.ts test/offline-recovery-units.test.ts test/offline-branch-context.test.ts test/offline-1038-shift-chain.test.ts test/offline-1038-synccenter.test.ts test/offline-sync-center-source.test.ts test/pos-ui-update.test.ts test/offline-1038-e2e.test.ts test/offline-1038-lifecycle.test.ts test/offline-1038-chains.test.ts test/offline-foundation-concurrency.test.ts test/offline-foundation-online-pins.test.ts test/offline-dinein-split.test.ts test/offline-split.test.ts test/offline-operational-projection.test.ts test/offline-dinein-shell-source.test.ts test/offline-phase-d-integration.test.ts test/offline-closure-rc10.test.ts test/offline-closure-rc11.test.ts test/offline-closure-rc12.test.ts test/offline-closure-rc13.test.ts test/offline-closure-rc14.test.ts test/native-defects-1038.test.ts test/offline-rc-diagnostics.test.ts test/staging-updater.test.ts test/upgrade-1037-to-1038.test.ts test/offline-1038-perf-retention.test.ts test/offline-1038-contracts-flag.test.ts test/offline-pay-order.test.ts test/offline-receivable-collect.test.ts

      - name: Focused regression tests (1.0.42 DESK-O merge E2E)
        run: node --test --test-concurrency=1 --import ./test/register.mjs --test-name-pattern="DESK-O" test/offline-1038-movemerge.test.ts

      - name: Run tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-suite.log
      - name: Full-suite summary (failures by name)
        if: always()
        shell: bash
        run: |
          grep -E "^(# |ℹ )(tests|suites|pass|fail|cancelled|skipped|todo)" full-suite.log || true
          echo "--- failing tests ---"
          grep -E "^\s*(not ok |✖ )" full-suite.log | grep -v "failing tests:" | sort -u || echo "(none)"

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: staging

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo test (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked
