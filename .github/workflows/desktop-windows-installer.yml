# ---------------------------------------------------------------------------
# Breadee Desktop — Windows INSTALLER ARTIFACT workflow
#
# PURPOSE: Build the Windows Tauri installer (NSIS setup .exe) on a clean,
# stable GitHub Windows runner and upload it as a downloadable build
# ARTIFACT. This exists because the local dev machine is unstable
# (cargo/rustc crash with 0xC0000005), so installers can't be built locally.
#
# THIS IS NOT A PRODUCTION RELEASE WORKFLOW:
#   - Triggers: manual (workflow_dispatch) + push to desktop-staging.
#     (A push trigger is needed so the workflow registers and appears in the
#     Actions sidebar; workflow_dispatch-only workflows only register from the
#     repo's default branch, which does not carry this file.)
#   - It does NOT create a GitHub Release / tag.
#   - It does NOT publish or distribute anything — the installer is only
#     retained as a temporary Actions artifact for internal testing.
#   - It requires NO secrets (no code-signing / updater keys configured).
#
# The installer produced here is an UNSIGNED Phase-1 test build.
# ---------------------------------------------------------------------------

name: Desktop Windows Installer (Artifact)

on:
  # Manual run from the Actions tab -> Run workflow.
  workflow_dispatch:
  # Also run on push to the desktop working branch. This both makes the
  # workflow visible/registered in the Actions sidebar and builds the
  # installer artifact on each push to desktop-staging.
  push:
    branches: [desktop-staging, claude/desktop-1031-payment-hotfix-clean, claude/desktop-1031-cumulative-repair, feat/desktop-1.0.37-offline-phase-c-dinein]
  # Build the installer for PRs into desktop-staging as well, so a reviewer can
  # download and smoke-test the actual .exe BEFORE the merge rather than after.
  # Safe to run on PRs: this is `pull_request` (never pull_request_target), so
  # the token stays read-only, and the workflow has no release/publish/tag step.
  # The only secrets are the STAGING Supabase URL + anon (publishable) key -
  # there is no code-signing or release credential in this repo to expose.
  pull_request:
    branches: [desktop-staging]

# Minimal permissions: this workflow only reads the repo (artifact upload
# uses the default token scope, no extra write perms needed).
permissions:
  contents: read

# Same rule as the build check: a newer commit supersedes an in-flight run for
# the same PR or branch, and separate PRs never cancel one another.
concurrency:
  group: desktop-windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Windows installer
    # Clean, stable Windows runner — WebView2 + MSVC build tools preinstalled.
    runs-on: windows-latest

    steps:
      # 1. Get the source.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node toolchain (npm cache keyed off package-lock.json).
      # Kept in step with the build-check workflow (see the note there): Node 24
      # is what the repo's tooling is developed and tested against.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install frontend deps exactly as locked.
      - name: Install frontend dependencies
        run: npm ci

      # 4. TypeScript type check (no emit).
      - name: Typecheck frontend
        run: npm run typecheck

      # 5. Build the frontend bundle into ./dist.
      #    (tauri build also runs beforeBuildCommand, but we build explicitly
      #    first so a frontend failure surfaces before the long Rust build.)
      #    Vite inlines these VITE_* values at build time (src/env.ts fails fast
      #    if the Supabase vars are missing, which renders a blank window).
      #    STAGING Supabase only — supplied via encrypted GitHub Actions
      #    secrets, never a committed .env.
      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: staging
          # Temporary offline-access RC diagnostics (1.0.37). The build fingerprint lets
          # the native tester confirm EXACTLY which build is installed, and the readout
          # surfaces the offline access decision on-screen. OFF in every other build.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_id }}
          VITE_RC_DIAGNOSTICS: "1"
          # 1.0.38 staging acceptance: the 1.0.38 server contracts are live on STAGING
          # (remainder settlement R = T - P, move_v2 / merge_v4, bill pins).
          VITE_SERVER_1038_CONTRACTS: "1"

      # 5b. Prove the bundle targets STAGING (never production) and carries the 1.0.38
      #     contracts switch ON (the compiled constant sits right after PartPaidBillError).
      - name: Verify bundle backend + 1.0.38 contracts flag
        shell: bash
        env:
          STAGING_REF: azjxprewycygsocusxjn
          PRODUCTION_REF: cltlqfqormkhppmbvyrv
        run: |
          grep -rlq "$STAGING_REF" dist/assets || { echo "::error::bundle does not reference the STAGING project"; exit 1; }
          if grep -rlq "$PRODUCTION_REF" dist/assets; then echo "::error::bundle references the PRODUCTION project"; exit 1; fi
          node -e "const fs=require('fs');const p='dist/assets';let ok=false;for(const f of fs.readdirSync(p).filter(x=>x.endsWith('.js'))){const s=fs.readFileSync(p+'/'+f,'utf8');const i=s.indexOf('this.name=\"PartPaidBillError\"');if(i>=0&&/=\"1\"\.trim\(\)===\"1\"/.test(s.slice(i,i+600)))ok=true}if(!ok){console.error('1.0.38 contracts flag NOT enabled in the bundle');process.exit(1)}console.log('1.0.38 contracts flag: ON')"
          echo "Bundle backend: STAGING ($STAGING_REF); production ref absent."

      # 6. Rust stable toolchain for the native Tauri backend.
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # 7. Cache Rust build artifacts to speed up subsequent runs.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 8. Build the Tauri app + NSIS installer (release profile).
      #    NOTE: this compiles + links the native app and packages the
      #    installer; it does NOT publish a release.
      #    tauri:build re-runs `npm run build` (beforeBuildCommand), so the same
      #    STAGING Supabase env must be present here too, or the packaged app
      #    ships a blank window. Secrets only — never a committed .env.
      #    The staging overlay gives the app the ONE Breadee Staging identity
      #    (app.breadee.desktop.staging, "Breadee Staging", breadee-desktop.exe) plus the
      #    STAGING updater endpoint + key - the same identity staging testers run - so
      #    installing it can never overwrite or stop a real production "Breadee" install
      #    or touch its data folder, and an installed acceptance build updates only from
      #    the staging channel. (The separate staging1038 identity is retired.) This
      #    workflow holds no signing key, so the second, generated override turns updater
      #    ARTIFACTS off: the installer is unsigned and is never a channel candidate -
      #    signed staging builds come only from desktop-staging-release.yml.
      - name: Build Tauri installer
        shell: bash
        run: |
          printf '%s' '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater-artifacts.json"
          npm run tauri:build -- --config src-tauri/tauri.staging.conf.json --config "$RUNNER_TEMP/no-updater-artifacts.json"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: staging
          # tauri:build re-runs the frontend build (beforeBuildCommand), so the same
          # RC-diagnostic fingerprint must be present here too, or the packaged app
          # would ship without it.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_id }}
          VITE_RC_DIAGNOSTICS: "1"
          VITE_SERVER_1038_CONTRACTS: "1"

      # 8b. Identity + checksum of the produced installer (and re-check the bundle the
      #     installer embeds — tauri:build re-ran the frontend build).
      - name: Verify installer identity
        shell: bash
        run: |
          ls -la src-tauri/target/release/bundle/nsis/
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          case "$(basename "$exe")" in "Breadee Staging_"*) ;; *) echo "::error::unexpected installer name $exe"; exit 1;; esac
          test -f "src-tauri/target/release/breadee-desktop.exe" || { echo "::error::main binary is not breadee-desktop.exe (Breadee Staging exe name)"; exit 1; }
          id=$(node -p "require('./src-tauri/tauri.staging.conf.json').identifier")
          [ "$id" = "app.breadee.desktop.staging" ] || { echo "::error::installer identity is '$id', not app.breadee.desktop.staging"; exit 1; }
          if ls src-tauri/target/release/bundle/nsis/*.sig >/dev/null 2>&1; then echo "::error::unexpected updater signature in an unsigned acceptance build"; exit 1; fi
          grep -rlq azjxprewycygsocusxjn dist/assets || { echo "::error::final bundle is not STAGING"; exit 1; }
          sha256sum "$exe"

      # 9. Upload the generated Windows installer as a build artifact.
      #    Tauri v2 (targets: ["nsis"]) emits the setup .exe here:
      #      src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: breadee-desktop-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
