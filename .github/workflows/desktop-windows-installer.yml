# ---------------------------------------------------------------------------
# Breadee Desktop — Windows INSTALLER ARTIFACT workflow
#
# PURPOSE: Build the Windows Tauri installer (NSIS setup .exe) on a clean,
# stable GitHub Windows runner and upload it as a downloadable build
# ARTIFACT. This exists because the local dev machine is unstable
# (cargo/rustc crash with 0xC0000005), so installers can't be built locally.
#
# THIS IS NOT A PRODUCTION RELEASE WORKFLOW:
#   - Triggers: manual (workflow_dispatch) + push to desktop-staging.
#     (A push trigger is needed so the workflow registers and appears in the
#     Actions sidebar; workflow_dispatch-only workflows only register from the
#     repo's default branch, which does not carry this file.)
#   - It does NOT create a GitHub Release / tag.
#   - It does NOT publish or distribute anything — the installer is only
#     retained as a temporary Actions artifact for internal testing.
#   - It requires NO secrets (no code-signing / updater keys configured).
#
# The installer produced here is an UNSIGNED Phase-1 test build.
# ---------------------------------------------------------------------------

name: Desktop Windows Installer (Artifact)

on:
  # Manual run from the Actions tab -> Run workflow.
  workflow_dispatch:
  # Also run on push to the desktop working branch. This both makes the
  # workflow visible/registered in the Actions sidebar and builds the
  # installer artifact on each push to desktop-staging.
  push:
    branches: [desktop-staging]

# Minimal permissions: this workflow only reads the repo (artifact upload
# uses the default token scope, no extra write perms needed).
permissions:
  contents: read

jobs:
  build-installer:
    name: Build Windows installer
    # Clean, stable Windows runner — WebView2 + MSVC build tools preinstalled.
    runs-on: windows-latest

    steps:
      # 1. Get the source.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node toolchain (npm cache keyed off package-lock.json).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install frontend deps exactly as locked.
      - name: Install frontend dependencies
        run: npm ci

      # 4. TypeScript type check (no emit).
      - name: Typecheck frontend
        run: npm run typecheck

      # 5. Build the frontend bundle into ./dist.
      #    (tauri build also runs beforeBuildCommand, but we build explicitly
      #    first so a frontend failure surfaces before the long Rust build.)
      #    Vite inlines these VITE_* values at build time (src/env.ts fails fast
      #    if the Supabase vars are missing, which renders a blank window).
      #    STAGING Supabase only — supplied via encrypted GitHub Actions
      #    secrets, never a committed .env.
      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: staging

      # 6. Rust stable toolchain for the native Tauri backend.
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # 7. Cache Rust build artifacts to speed up subsequent runs.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 8. Build the Tauri app + NSIS installer (release profile).
      #    NOTE: this compiles + links the native app and packages the
      #    installer; it does NOT publish a release.
      #    tauri:build re-runs `npm run build` (beforeBuildCommand), so the same
      #    STAGING Supabase env must be present here too, or the packaged app
      #    ships a blank window. Secrets only — never a committed .env.
      - name: Build Tauri installer
        run: npm run tauri:build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: staging

      # 9. Upload the generated Windows installer as a build artifact.
      #    Tauri v2 (targets: ["nsis"]) emits the setup .exe here:
      #      src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: breadee-desktop-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
