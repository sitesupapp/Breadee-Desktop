[package]
name = "breadee-desktop"
version = "1.0.5"
description = "Breadee Desktop"
authors = ["Breadee"]
edition = "2021"

[lib]
name = "breadee_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only. A POS terminal must never run two tills at once - see the
# single-instance guard in `src/lib.rs`. Scoped by target rather than added to
# the shared list because the crate is itself compiled out on android/ios, so a
# mobile build would fail to resolve it.
#
# The updater and `process` are scoped the same way and for the same reason. The
# updater replaces the installed application, which is a desktop concept only;
# `process` is here solely so the app can relaunch itself once an update has been
# installed - Tauri's updater installs but does not restart.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Native printing (Level 3E-A), Windows only.
#
# NOT A NEW DEPENDENCY. `windows` is already in Cargo.lock at 0.61.3, pulled in
# transitively by tauri -> wry -> webview2-com; this entry names that same
# version and turns on the feature modules the printer path needs. So the
# lockfile gains no crate and no version, and nothing unrelated is upgraded.
#
# Four features, and each is load-bearing:
#   Win32_Graphics_Printing - EnumPrintersW / GetDefaultPrinterW / status bits
#   Win32_Graphics_Gdi      - the printer DC, fonts, and DrawTextW, which is
#                             what gives Arabic shaping and bidi for free
#   Win32_Storage_Xps       - StartDocW / StartPage / EndPage / EndDoc / AbortDoc
#   Win32_Security          - PRINTER_INFO_2W embeds a security descriptor, so
#                             the struct will not compile without it
#   Win32_Foundation        - RECT, used to lay each line out
#
# Deliberately absent: anything for shell, filesystem, sockets or process
# control. This crate is enormous and feature-gated for exactly this reason -
# taking printing must not quietly take the rest of Win32 with it.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Storage_Xps",
] }
